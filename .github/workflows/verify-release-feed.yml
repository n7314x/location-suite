name: Verify iOS Release Feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-release-feed.yml"
      - "scripts/release_feed.py"
      - "scripts/verify_release.py"
      - "scripts/tests/**"
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-release-tools:
    name: Test release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run release tooling tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Explain unavailable production feed
        if: ${{ vars.LOCATION_SUITE_RELEASE_BASE_URL == '' }}
        run: |
          echo "::notice title=Production feed not configured::Set LOCATION_SUITE_RELEASE_BASE_URL after public release hosting is operational."
          {
            echo "### Production release feed verification skipped"
            echo ""
            echo "Public release hosting has not been configured. The release tooling tests still run."
            echo "Set repository variable LOCATION_SUITE_RELEASE_BASE_URL to an HTTPS base URL after publishing the feed."
          } >> "$GITHUB_STEP_SUMMARY"

  verify-feed:
    name: Verify configured production feed
    if: ${{ vars.LOCATION_SUITE_RELEASE_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_BASE_URL: ${{ vars.LOCATION_SUITE_RELEASE_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify latest source, metadata, IPA size, and SHA-256
        run: python3 scripts/verify_release.py --remote-source-url "$RELEASE_BASE_URL/source.json"
