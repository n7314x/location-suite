name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "contracts/**"
      - "scripts/build_unsigned_ipa.sh"
      - "scripts/release_feed.py"
      - "scripts/verify_release.py"
      - "scripts/tests/**"
      - ".github/workflows/build-ios-ipa.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "contracts/**"
      - "scripts/build_unsigned_ipa.sh"
      - "scripts/release_feed.py"
      - "scripts/verify_release.py"
      - "scripts/tests/**"
      - ".github/workflows/build-ios-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Test and build unsigned LocationSuite.ipa
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.98.1 and iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-ios
          components: rustfmt, clippy

      - name: Record build environment
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Validate project inputs
        run: |
          set -euo pipefail
          test -f ios/TLocation.xcodeproj/project.pbxproj
          test -f ios/TLocation/Info.plist
          test -f ios/TLocation/TLocation.entitlements
          test -f ios/TLocation/idevice/libidevice_ffi.a
          test -f ios/SelfMaintenanceCore/Cargo.lock
          test -f ios/TLocation/self_maintenance/location_self_maintenance.h
          cargo fmt --manifest-path ios/SelfMaintenanceCore/Cargo.toml -- --check
          cargo clippy --locked --manifest-path ios/SelfMaintenanceCore/Cargo.toml -- -D warnings
          cargo test --locked --manifest-path ios/SelfMaintenanceCore/Cargo.toml
          xcodebuild -project ios/TLocation.xcodeproj -list

      - name: Run deterministic Swift tests
        run: swift test --package-path ios

      - name: Run release tooling tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build canonical unsigned IPA
        id: package
        env:
          OUTPUT_DIR: ${{ runner.temp }}/location-suite-output
        run: scripts/build_unsigned_ipa.sh "$OUTPUT_DIR"

      - name: Add build summary
        env:
          IPA_SIZE: ${{ steps.package.outputs.ipa_size }}
          IPA_SHA256: ${{ steps.package.outputs.ipa_sha256 }}
          VERSION: ${{ steps.package.outputs.version }}
          BUILD_VERSION: ${{ steps.package.outputs.build_version }}
        run: |
          {
            echo "### iOS IPA build"
            echo
            echo "- Runner: \`xcode-27\` (\`$(uname -m)\`)"
            echo "- Xcode: \`$(xcodebuild -version | tr '\n' ' ')\`"
            echo "- iOS SDK: \`$(xcrun --sdk iphoneos --show-sdk-version)\`"
            echo "- Version/build: \`$VERSION ($BUILD_VERSION)\`"
            echo "- Signing: disabled; intended for local on-device signing or recovery installation"
            echo "- IPA: \`LocationSuite.ipa\` ($IPA_SIZE bytes)"
            echo "- SHA-256: \`$IPA_SHA256\`"
            echo "- Payload app: \`Payload/TLocation.app\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LocationSuite.ipa and metadata
        uses: actions/upload-artifact@v7
        with:
          name: LocationSuite-IPA
          path: |
            ${{ steps.package.outputs.ipa_path }}
            ${{ steps.package.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: LocationSuite-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/location-suite-output/LocationSuite-xcodebuild.log
          if-no-files-found: ignore
          retention-days: 30
